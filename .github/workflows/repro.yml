# Reproduces godotengine/godot#123707 ("Disposable not registered" -> SIGABRT) with the official Godot .NET build
# and ordinary game code, on Linux, macOS and Windows. See ci/run-scenarios.sh for the scenarios and expectations.
name: repro-123707

on:
  workflow_dispatch:
  push:

jobs:
  repro:
    name: ${{ matrix.os }} / .NET ${{ matrix.dotnet }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # .NET 9 everywhere: the reporter's runtime.
          - os: ubuntu-24.04
            dotnet: "9.0"
            godot_zip: Godot_v4.7.2-stable_mono_linux_x86_64.zip
            godot_bin: Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64
          - os: macos-14 # Apple Silicon, like the reporter
            dotnet: "9.0"
            godot_zip: Godot_v4.7.2-stable_mono_macos.universal.zip
            godot_bin: Godot_mono.app/Contents/MacOS/Godot
          - os: windows-2022
            dotnet: "9.0"
            godot_zip: Godot_v4.7.2-stable_mono_win64.zip
            godot_bin: Godot_v4.7.2-stable_mono_win64/Godot_v4.7.2-stable_mono_win64_console.exe
          # .NET 10 on Linux: where the first CI run found crashes without any Dispose call in game code.
          - os: ubuntu-24.04
            dotnet: "10.0"
            godot_zip: Godot_v4.7.2-stable_mono_linux_x86_64.zip
            godot_bin: Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "${{ matrix.dotnet }}.x"

      - name: Download official Godot 4.7.2 .NET
        run: |
          curl -sfL --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/${{ matrix.godot_zip }}"
          if command -v unzip > /dev/null; then unzip -q godot.zip -d godot-bin; else 7z x -y -ogodot-bin godot.zip > /dev/null; fi
          echo "GODOT=$PWD/godot-bin/${{ matrix.godot_bin }}" >> "$GITHUB_ENV"

      # Godot's editor binary starts .NET through its own GodotPlugins.runtimeconfig.json (rollForward:
      # LatestMajor): it uses the newest runtime it can see, and setup-dotnet installs a .NET 10 runtime too.
      # So the game gets a folder holding ONLY the wanted runtime, and Godot is pointed at it via DOTNET_ROOT
      # (Godot's hostfxr resolver checks DOTNET_ROOT before PATH and the default install locations).
      - name: Runtime-only .NET folder for the game
        run: |
          RT="$RUNNER_TEMP/game-dotnet-${{ matrix.dotnet }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -Command "Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile \"$RUNNER_TEMP/dotnet-install.ps1\"; & \"$RUNNER_TEMP/dotnet-install.ps1\" -Runtime dotnet -Channel ${{ matrix.dotnet }} -InstallDir \"$RT\""
          else
            curl -sSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
            bash "$RUNNER_TEMP/dotnet-install.sh" --runtime dotnet --channel ${{ matrix.dotnet }} --install-dir "$RT"
          fi
          echo "Runtimes Godot will see:"; ls "$RT/shared/Microsoft.NETCore.App"
          echo "GAME_DOTNET_ROOT=$RT" >> "$GITHUB_ENV"

      - name: Build the game's C# and import the project
        working-directory: godot-project
        run: |
          dotnet build -p:GodotTfm=net${{ matrix.dotnet }}
          "$GODOT" --headless --path . --import

      - name: Run scenarios
        env:
          DOTNET_ROOT: ${{ env.GAME_DOTNET_ROOT }}
        run: |
          unset DOTNET_ROOT_X64 DOTNET_ROOT_ARM64 # these would take precedence over DOTNET_ROOT
          ci/run-scenarios.sh "$GODOT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.os }}-net${{ matrix.dotnet }}
          path: ci/logs/
